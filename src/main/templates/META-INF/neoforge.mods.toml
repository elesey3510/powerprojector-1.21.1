[[mods]] 

modId="${mod_id}" 

version="${mod_version}" 

displayName="Power Projector"

authors="elesey3510"

description='''
Realistic electric directional spotlights for Create: Power Grid, powered by Veil deferred shader lighting engine and Sable physics.
'''

[[mixins]]
config="${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

